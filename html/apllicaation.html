<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="form.html" method="post" >
        <fieldset>
            <h1>application form</h1>
            <label for="name">Name</label><br>
            <input type="text" id="name" required><br><br>
            <label for="email">Email</label><br>
            <input type="email" id="email" required><br><br>
            <label for="phone">Phone Number</label><br>
            <input type="number" id="phone" required><br><br>
            <label for="password">Password</label><br>
            <input type="password" id="password" ><br><br>
            <label for="cpass">Confirm Password</label><br>
            <input type="password" id="cpass" ><br><br>
            <label for="address">Address</label><br>
            <textarea id="address" name="address" rows="4" cols="50"></textarea><br><br>
            <label for="gender">Gender</label><br>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label><br><br>
            <label for="age" >Age</label><br>
            <input type="age" id="age" ><br><br>
            <label for="date" >date of birth</label><br>
            <input type="date" id="date" ><br><br>
            <label for="course" >Course</label><br>
            <input type="checkbox" id="course1" name="course" value="html">
            <label for="course1">HTML</label>   
            <input type="checkbox" id="course2" name="course" value="css">
            <label for="course2">CSS</label>
            <input type="checkbox" id="course3" name="course" value="javascript">   
            <label for="course3">JavaScript</label><br><br>
            <label for="branch" >Branch</label><br>
            <select id="branch" name="branch">
                <option value="select">select</option>
                <option value="shivajinager">SHIVAJINAGAR</option>
                <option value="hadapsar">HADAPSAR</option>
                <option value="karvenagar">KARVENAGAR</option>        
            </select><br><br>
        
            
            <input type="submit" value="Submit">
        </fieldset>

    </form>
</body>
</html>
