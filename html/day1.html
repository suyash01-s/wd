<!DOCTYPE html>  <!--current version of html i.e html 5 --> 
<html lang="en">  
<head>
    <meta charset="UTF-8">  <!-- 1.meta tag use to provides a additional information  
                                 2.meta tag use for SEO(search engine optimization)  
                                 3.meta tag use to create a responsive page web-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 1</title> <!-- for giving a title to the webpage -->
</head>
<body>
    <h1>Heading 1</h1> <!-- for giving a heading to the webpage -->
    <h2>Heading 2</h2> <!-- for giving a subheading to the webpage -->
    <h3>Heading 3</h3> <!-- for giving a subheading to the webpage -->
    <h4>Heading 4</h4> <!-- for giving a subheading to the webpage -->
    <h5>Heading 5</h5> <!-- for giving a subheading to the webpage -->
    <h6>Heading 6</h6> <!-- for giving a subheading to the webpage -->
    <p>This is a paragraph.</p> <!-- for giving a paragraph to the webpage -->

    <!-- text formatting tags -->
      <b>Bold Text</b> <!-- for making the text bold -->
      <strong>Strong Text</strong> <!-- for making the text strong -->
      <i>Italic Text</i> <!-- for making the text italic -->
      <em>Emphasized Text</em> <!-- for making the text emphasized -->
      <u>Underline Text</u> <!-- for making the text underlined -->
      <ins>Inserted Text</ins> <!-- for marking inserted text -->
      <del>Deleted Text</del> <!-- for marking deleted text -->
      <s>Strikethrough Text</s> <!-- for marking strikethrough text -->
      <strike>Strike Text</strike> <!-- for marking strike text -->
      <pre>Preformatted Text</pre> <!-- for displaying preformatted text -->
      H<sub>2</sub>O <!-- for displaying subscript text -->
      H<sup>2</sup>O <!-- for displaying superscript text -->
      <marquee behavior="" direction="right">Marquee Text</marquee> <!-- for creating a scrolling text effect -->
      <abbr title="Hyper text markup language">Html</abbr>
      <acronym title="Cascading style sheet">CSS</acronym>
</body> 
</html>
